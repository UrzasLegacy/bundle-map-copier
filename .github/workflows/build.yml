name: Build and release

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release tag matches project version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Release tag must be v$VERSION"; exit 1; }
      - name: Test and build
        run: bash ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: BundleMapCopier
          path: build/libs/*.jar
          if-no-files-found: error

  attach-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BundleMapCopier
          path: release-files
      - name: Attach plugin JAR to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-files/*.jar --repo "$GITHUB_REPOSITORY"
